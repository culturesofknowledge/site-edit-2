{% load cl_filters %}
{% if descriptor and descriptor.name %}
    <div class="form-descriptor">
        <div class="desc-name">
            <h3> Repository: {{ descriptor.name }}</h3>
        </div>
    </div>
    <div class="margin-bottom sub-form-desc">
        <small>
            <i>
            <span class="desc-id">Repository ID {{ descriptor.id }}.</span>
            {% if descriptor.change_timestamp %}
                Last change {{ descriptor.change_timestamp|standard_datetime }}
                    by {{ descriptor.change_user }}
            {% endif %}
            </i>
        </small>
    </div>
{% endif %}
