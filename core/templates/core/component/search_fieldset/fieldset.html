{% load static %}

<div class="fieldset-container">
<fieldset class="search-fieldset">

    <!-- Advanced search toggle -->
    <div class="row-no-margin" style="padding: 1em;">
        <input type="checkbox" id="advanced_search">
        <label for="advanced_search" class="control">Advanced search</label>
    </div>

    {% block fields %}
    {% endblock %}

    {% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}

</fieldset>
</div>

<script src="{% static 'core/js/dateinput.js' %}"></script>
