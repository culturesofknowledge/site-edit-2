{{ field }}
<label for="{{ field.id_for_label }}"
        {% if class_name %}
       class="{{ class_name }}"
        {% endif %}
>
    <span class="checkbox-label-text">
    {% if is_normal_size %}
        {{ name|safe }}
    {% else %}
        <small> {{ name|safe }} </small>
    {% endif %}
    </span>
</label>
